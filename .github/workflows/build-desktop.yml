name: Build Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 1. Frontend Build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: wa-frontend/package-lock.json

      - name: Build wa-frontend
        working-directory: wa-frontend
        run: |
          npm ci
          npm run build:desktop

      # 2. Setup .NET & Velopack Tool
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache .NET Tools
        id: cache-dotnet-tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-vpk
          
      - name: Install vpk Tool
        if: steps.cache-dotnet-tools.outputs.cache-hit != 'true'
        run: dotnet tool install -g vpk

      # 3. Setup Build Tools
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('wa-desktop/**/*.csproj', 'wa-desktop/**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: wa-desktop
        run: nuget restore WaDesktop.sln

      # 4. Set Assembly Version
      - name: Generate AssemblyInfo
        shell: pwsh
        run: |
          $dir = "wa-desktop/src/WaDesktop.Client/Properties"
          New-Item -Force -ItemType Directory -Path $dir | Out-Null
          @"
          using System.Reflection;
          using System.Runtime.InteropServices;

          [assembly: AssemblyTitle("WaDesktop")]
          [assembly: AssemblyDescription("WhatsApp Desktop Client")]
          [assembly: AssemblyConfiguration("Release")]
          [assembly: AssemblyCompany("")]
          [assembly: AssemblyProduct("WaDesktop")]
          [assembly: AssemblyCopyright("Copyright © $(Get-Date).Year")]
          [assembly: AssemblyTrademark("")]
          [assembly: AssemblyCulture("")]
          [assembly: ComVisible(false)]
          [assembly: Guid("c3d4e5f6-a7b8-9012-cdef-123456789012")]
          [assembly: AssemblyVersion("$env:VERSION.0")]
          [assembly: AssemblyFileVersion("$env:VERSION.0")]
          "@ | Out-File -FilePath "$dir/AssemblyInfo.cs" -Encoding utf8

      # 5. Compile App
      - name: Build (Release)
        working-directory: wa-desktop
        run: msbuild WaDesktop.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /m

      # 6. Velopack Packaging
      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack --packId "WaDesktop" --packTitle "WaDesktop" --packVersion $env:VERSION --packDir "wa-desktop/src/WaDesktop.Client/bin/Release" --mainExe "WaDesktop.exe"

      # 7. Upload to GitHub Releases
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/*
          name: WaDesktop ${{ env.VERSION }}
          generate_release_notes: true
