name: Build Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: wa-frontend/package-lock.json

      - name: Build wa-frontend
        working-directory: wa-frontend
        run: |
          npm ci
          npm run build:desktop

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate AssemblyInfo
        shell: pwsh
        run: |
          $dir = "wa-desktop/src/WaDesktop.Client/Properties"
          New-Item -Force -ItemType Directory -Path $dir | Out-Null
          $year = (Get-Date).Year
          $lines = @(
            "using System.Reflection;",
            "using System.Runtime.InteropServices;",
            "",
            '[assembly: AssemblyTitle("Whatsapp Client")]',
            '[assembly: AssemblyDescription("WhatsApp Desktop Client")]',
            '[assembly: AssemblyConfiguration("Release")]',
            '[assembly: AssemblyCompany("")]',
            '[assembly: AssemblyProduct("Whatsapp Client")]',
            "[assembly: AssemblyCopyright(`"Copyright © $year`")]",
            '[assembly: AssemblyTrademark("")]',
            '[assembly: AssemblyCulture("")]',
            '[assembly: ComVisible(false)]',
            '[assembly: Guid("c3d4e5f6-a7b8-9012-cdef-123456789012")]',
            "[assembly: AssemblyVersion(`"$env:VERSION.0`")]",
            "[assembly: AssemblyFileVersion(`"$env:VERSION.0`")]"
          )
          $lines | Out-File -FilePath "$dir/AssemblyInfo.cs" -Encoding utf8

      - name: Restore NuGet packages
        working-directory: wa-desktop
        run: nuget restore WaDesktop.sln

      - name: Build (Release)
        working-directory: wa-desktop
        run: msbuild src/WaDesktop.Client/WaDesktop.Client.csproj /p:Configuration=Release /p:AssemblyName="WhatsApp Client"

      - name: Cache vpk tool
        id: cache-vpk
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-vpk

      - name: Install vpk
        if: steps.cache-vpk.outputs.cache-hit != 'true'
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack --packId "WaDesktop" --packTitle "Whatsapp Client" --packVersion $env:VERSION --packDir "wa-desktop/src/WaDesktop.Client/bin/Release" --mainExe "WhatsApp Client.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/*
          name: Whatsapp Client ${{ env.VERSION }}
          generate_release_notes: true
